<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>汤汤的每日打卡</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #F5F4F0;
    --card: #FFFFFF;
    --text-primary: #2C2C2A;
    --text-secondary: #888780;
    --text-hint: #B4B2A9;
    --border: rgba(0,0,0,0.08);
    --radius-card: 20px;
    --radius-item: 14px;
    --purple: #7F77DD;
    --purple-light: #EEEDFE;
    --teal: #1D9E75;
    --teal-light: #E1F5EE;
    --amber: #BA7517;
    --amber-light: #FAEEDA;
    --coral: #D85A30;
    --coral-light: #FAECE7;
    --blue: #378ADD;
    --blue-light: #E6F1FB;
    --pink: #D4537E;
    --pink-light: #FBEAF0;
  }

  body {
    background: var(--bg);
    font-family: -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
    min-height: 100vh;
    padding: 0 0 120px;
  }

  /* Header */
  .header {
    background: var(--card);
    padding: 56px 20px 24px;
    border-bottom: 0.5px solid var(--border);
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
  }
  .greeting { font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; }
  .date-title { font-size: 22px; font-weight: 600; color: var(--text-primary); }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--purple-light);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }

  /* Progress summary */
  .progress-summary {
    display: flex; align-items: center; gap: 12px;
    margin-top: 14px;
  }
  .progress-bar-wrap {
    flex: 1; height: 6px; background: var(--bg); border-radius: 99px; overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%; border-radius: 99px;
    background: var(--purple);
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
  }
  .progress-text { font-size: 13px; font-weight: 500; color: var(--purple); min-width: 36px; text-align: right; }

  /* Calendar strip */
  .cal-section { margin-top: 18px; }
  .cal-nav {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .cal-month-label { font-size: 13px; font-weight: 500; color: var(--text-primary); }
  .cal-nav-btn {
    background: none; border: none; cursor: pointer;
    width: 28px; height: 28px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-secondary); font-size: 16px;
    transition: background 0.15s;
  }
  .cal-nav-btn:active { background: var(--bg); }
  .cal-weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr);
    text-align: center; margin-bottom: 4px;
  }
  .cal-wd {
    font-size: 10px; font-weight: 500; color: var(--text-hint);
    padding: 2px 0;
  }
  .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }
  .cal-day {
    aspect-ratio: 1; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 2px;
    font-size: 13px; font-weight: 500; color: var(--text-secondary);
    cursor: pointer; position: relative;
    transition: background 0.15s;
  }
  .cal-day:active { background: rgba(0,0,0,0.04); }
  .cal-day.empty { pointer-events: none; }
  .cal-day.today {
    background: var(--purple);
    color: #fff;
    font-weight: 600;
  }
  .cal-day.checked:not(.today) {
    background: var(--purple-light);
    color: var(--purple);
  }
  .cal-day.checked.today { background: var(--purple); color: #fff; }
  .cal-dot {
    width: 4px; height: 4px; border-radius: 50%;
    background: currentColor; opacity: 0.5;
    display: none;
  }
  .cal-day.checked .cal-dot { display: block; }
  .cal-day.today .cal-dot { opacity: 0.7; }

  /* Tabs */
  .tabs {
    display: flex; gap: 8px;
    padding: 14px 20px 0;
    overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    white-space: nowrap; font-size: 13px; font-weight: 500;
    padding: 6px 14px; border-radius: 99px; cursor: pointer;
    border: 1.5px solid transparent;
    color: var(--text-secondary);
    background: var(--card);
    transition: all 0.2s;
  }
  .tab.active {
    background: var(--purple);
    color: #fff;
  }

  /* Section */
  .section { padding: 18px 16px 0; }
  .section-label {
    font-size: 11px; font-weight: 500;
    color: var(--text-hint); text-transform: uppercase; letter-spacing: 0.08em;
    padding: 0 4px; margin-bottom: 8px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .section-label-right { display: flex; align-items: center; gap: 6px; }

  /* Card group */
  .card-group {
    background: var(--card);
    border-radius: var(--radius-card);
    overflow: hidden;
    border: 0.5px solid var(--border);
  }

  /* Check item */
  .check-item {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 16px;
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
  }
  .check-item:not(:last-child)::after {
    content: '';
    position: absolute; bottom: 0; left: 54px; right: 0;
    height: 0.5px; background: var(--border);
  }
  .check-item:active { background: var(--bg); }

  /* Icon circle */
  .item-icon {
    width: 34px; height: 34px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; flex-shrink: 0;
    transition: transform 0.2s;
  }

  .item-content { flex: 1; min-width: 0; }
  .item-title-row { display: flex; align-items: center; gap: 6px; }
  .item-title {
    font-size: 15px; font-weight: 500; color: var(--text-primary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color 0.2s;
  }
  .item-sub {
    font-size: 12px; color: var(--text-hint); margin-top: 2px;
  }
  .item-edit-btn {
    width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; cursor: pointer;
    color: var(--text-hint); font-size: 13px; opacity: 0;
    transition: opacity 0.15s, background 0.15s;
  }
  .check-item:hover .item-edit-btn,
  .check-item:has(.item-edit-btn:focus) .item-edit-btn,
  .item-edit-btn.visible { opacity: 1 !important; }

  /* Checkbox */
  .checkbox {
    width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0;
    border: 2px solid var(--border-check, #D3D1C7);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.25s cubic-bezier(.34,1.56,.64,1);
    background: transparent;
  }
  .checkbox svg { opacity: 0; transform: scale(0.5); transition: all 0.2s cubic-bezier(.34,1.56,.64,1); }

  /* Checked state */
  .check-item.done .checkbox {
    background: var(--check-color, var(--purple));
    border-color: var(--check-color, var(--purple));
  }
  .check-item.done .checkbox svg { opacity: 1; transform: scale(1); }
  .check-item.done .item-title { color: var(--text-hint); text-decoration: line-through; }
  .check-item.done .item-icon { transform: scale(0.92); opacity: 0.5; }

  /* Add button inside card group */
  .add-btn {
    display: flex; align-items: center; justify-content: center;
    gap: 6px; width: 100%; padding: 11px;
    font-size: 13px; font-weight: 500; color: var(--text-hint);
    background: none; border: none; cursor: pointer;
    border-top: 0.5px dashed var(--border);
    transition: color 0.15s, background 0.15s;
  }
  .add-btn:active { background: var(--bg); color: var(--purple); }
  .add-btn-icon { font-size: 17px; line-height: 1; }

  /* Delete btn on item (shown when editing) */
  .item-delete-btn {
    position: absolute; right: 48px; top: 50%;
    transform: translateY(-50%);
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--coral-light); color: var(--coral);
    border: none; cursor: pointer; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.15s;
  }
  .check-item.show-del .item-delete-btn { opacity: 1; pointer-events: auto; }

  /* Motivational footer card */
  .motive-card {
    margin: 18px 16px 0;
    background: var(--purple);
    border-radius: var(--radius-card);
    padding: 20px;
    display: flex; align-items: center; gap: 16px;
  }
  .motive-emoji { font-size: 36px; }
  .motive-text { color: #fff; }
  .motive-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .motive-sub { font-size: 12px; opacity: 0.75; }

  /* Reset & Manage btns */
  .bottom-actions {
    display: flex; align-items: center; justify-content: center; gap: 20px;
    margin-top: 16px;
  }
  .reset-btn, .manage-btn {
    font-size: 13px; color: var(--text-hint);
    background: none; border: none; cursor: pointer;
    padding: 8px 16px;
  }
  .manage-btn.active { color: var(--coral); }

  /* Confetti */
  .confetti-wrap {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 999;
  }

  /* Tab content sections */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* All-done state */
  .all-done-banner {
    margin: 0 16px;
    padding: 14px 16px;
    background: var(--teal-light);
    border-radius: var(--radius-item);
    border: 1px solid rgba(29,158,117,0.2);
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; font-weight: 500; color: var(--teal);
    display: none;
  }

  /* ===== Modal (Add / Edit) ===== */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 2000;
    background: rgba(0,0,0,0.35);
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s;
  }
  .modal-overlay.show { opacity: 1; pointer-events: auto; }

  .modal-sheet {
    width: 100%; max-width: 480px;
    background: var(--card);
    border-radius: 22px 22px 0 0;
    padding: 28px 24px 40px;
    transform: translateY(100%);
    transition: transform 0.32s cubic-bezier(.32,.72,0,1);
  }
  .modal-overlay.show .modal-sheet { transform: translateY(0); }

  .modal-handle {
    width: 38px; height: 4px; border-radius: 2px;
    background: var(--border); margin: 0 auto 22px;
  }
  .modal-title {
    font-size: 19px; font-weight: 600; color: var(--text-primary);
    margin-bottom: 22px; text-align: center;
  }

  .modal-field { margin-bottom: 16px; }
  .modal-field label {
    display: block; font-size: 12px; font-weight: 500;
    color: var(--text-secondary); margin-bottom: 6px;
  }
  .modal-input {
    width: 100%; padding: 12px 14px;
    border: 1.5px solid var(--border); border-radius: 14px;
    font-size: 15px; color: var(--text-primary);
    background: var(--bg);
    outline: none; font-family: inherit;
    transition: border-color 0.2s;
  }
  .modal-input:focus { border-color: var(--purple); }

  .modal-cat-row {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .cat-option {
    padding: 10px 4px; border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--card); text-align: center;
    cursor: pointer; font-size: 13px;
    transition: all 0.15s; user-select: none;
  }
  .cat-option.selected {
    border-color: var(--purple); background: var(--purple-light);
    color: var(--purple); font-weight: 500;
  }
  .cat-option span:first-of-type { display: block; font-size: 20px; margin-bottom: 2px; }
  .cat-option span:last-of-type { font-size: 11px; color: inherit; opacity: 0.8; }

  .emoji-grid {
    display: flex; flex-wrap: wrap; gap: 6px;
  }
  .emoji-opt {
    width: 40px; height: 40px; border-radius: 10px;
    border: 1.5px solid transparent; background: var(--bg);
    font-size: 20px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all 0.12s;
  }
  .emoji-opt.selected { border-color: var(--purple); background: var(--purple-light); }

  .color-grid {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .color-opt {
    width: 30px; height: 30px; border-radius: 9px;
    border: 2.5px solid transparent; cursor: pointer;
    transition: transform 0.12s, border-color 0.12s;
  }
  .color-opt.selected { border-color: var(--text-primary); transform: scale(1.12); }

  .modal-actions {
    display: flex; gap: 12px; margin-top: 26px;
  }
  .modal-btn {
    flex: 1; padding: 13px; border-radius: 14px;
    font-size: 15px; font-weight: 500; cursor: pointer;
    border: none; transition: opacity 0.15s;
    font-family: inherit;
  }
  .modal-btn-cancel {
    background: var(--bg); color: var(--text-secondary);
  }
  .modal-btn-confirm {
    background: var(--purple); color: #fff;
  }
  .modal-btn-danger {
    background: var(--coral-light); color: var(--coral);
    flex: 0 0 auto; width: 80px;
  }
  .modal-btn:active { opacity: 0.8; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="greeting" id="greeting-text">早上好 ☀️</div>
      <div class="date-title" id="date-title">今天，认真生活</div>
    </div>
    <div class="avatar">🐱</div>
  </div>

  <!-- 日历打卡 -->
  <div class="cal-section">
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="calPrev()">‹</button>
      <div class="cal-month-label" id="cal-month-label"></div>
      <button class="cal-nav-btn" onclick="calNext()">›</button>
    </div>
    <div class="cal-weekdays">
      <div class="cal-wd">日</div><div class="cal-wd">一</div><div class="cal-wd">二</div>
      <div class="cal-wd">三</div><div class="cal-wd">四</div><div class="cal-wd">五</div>
      <div class="cal-wd">六</div>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

  <div class="progress-summary">
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
    </div>
    <div class="progress-text" id="progress-text">0%</div>
  </div>
</div>

<div class="tabs" id="tabs-bar">
  <div class="tab active" onclick="switchTab('all', this)">全部</div>
  <div class="tab" onclick="switchTab('morning', this)">晨间</div>
  <div class="tab" onclick="switchTab('work', this)">工作</div>
  <div class="tab" onclick="switchTab('health', this)">健康</div>
  <div class="tab" onclick="switchTab('evening', this)">晚间</div>
</div>

<div id="all-done-banner" class="all-done-banner" style="margin-top:18px;">
  ✦ 今日全部完成！你太棒了 🎉
</div>

<!-- 全部 -->
<div id="tab-all" class="tab-content active">
  <div class="section"><div class="section-label"><span>🌅 晨间</span></div><div class="card-group" id="group-morning-all"></div></div>
  <div class="section"><div class="section-label"><span>💼 工作</span></div><div class="card-group" id="group-work-all"></div></div>
  <div class="section"><div class="section-label"><span>🏃 健康</span></div><div class="card-group" id="group-health-all"></div></div>
  <div class="section"><div class="section-label"><span>🌙 晚间</span></div><div class="card-group" id="group-evening-all"></div></div>
</div>

<!-- 晨间 -->
<div id="tab-morning" class="tab-content"><div class="section"><div class="card-group" id="group-morning-tab"></div></div></div>
<!-- 工作 -->
<div id="tab-work" class="tab-content"><div class="section"><div class="card-group" id="group-work-tab"></div></div></div>
<!-- 健康 -->
<div id="tab-health" class="tab-content"><div class="section"><div class="card-group" id="group-health-tab"></div></div></div>
<!-- 晚间 -->
<div id="tab-evening" class="tab-content"><div class="section"><div class="card-group" id="group-evening-tab"></div></div></div>

<div class="motive-card" id="motive-card">
  <div class="motive-emoji" id="motive-emoji">🌿</div>
  <div class="motive-text">
    <div class="motive-title" id="motive-title">今天也要好好的</div>
    <div class="motive-sub" id="motive-sub">一项一项来，不慌不忙</div>
  </div>
</div>

<div class="bottom-actions">
  <button class="manage-btn" id="manage-btn" onclick="toggleManageMode()">✏️ 管理计划</button>
  <button class="reset-btn" onclick="resetAll()">↺ 重置今日打卡</button>
</div>

<canvas class="confetti-wrap" id="confetti"></canvas>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="modal" onclick="closeModalOnBg(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">添加新计划</div>
    <div class="modal-field">
      <label>名称</label>
      <input class="modal-input" id="f-title" placeholder="例如：背单词" maxlength="20">
    </div>
    <div class="modal-field">
      <label>备注（选填）</label>
      <input class="modal-input" id="f-sub" placeholder="简短描述" maxlength="30">
    </div>
    <div class="modal-field">
      <label>分类</label>
      <div class="modal-cat-row" id="f-cat-row">
        <div class="cat-option" data-cat="morning" onclick="selectCat(this)"><span>🌅</span>晨间</div>
        <div class="cat-option" data-cat="work" onclick="selectCat(this)"><span>💼</span>工作</div>
        <div class="cat-option" data-cat="health" onclick="selectCat(this)"><span>🏃</span>健康</div>
        <div class="cat-option selected" data-cat="evening" onclick="selectCat(this)"><span>🌙</span>晚间</div>
      </div>
    </div>
    <div class="modal-field">
      <label>图标</label>
      <div class="emoji-grid" id="f-emoji-grid"></div>
    </div>
    <div class="modal-field">
      <label>颜色</label>
      <div class="color-grid" id="f-color-grid"></div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn modal-btn-cancel" onclick="closeModal()">取消</button>
      <button class="modal-btn modal-btn-danger" id="btn-delete-task" style="display:none;" onclick="deleteCurrentTask()">删除</button>
      <button class="modal-btn modal-btn-confirm" onclick="saveTask()">保存</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   DATA — custom tasks stored in localStorage under key 'mytasks'
   Default tasks are built-in but can be removed.
   ============================================================ */

const CAT_LABELS = { morning:'🌅 晨间', work:'💼 工作', health:'🏃 健康', evening:'🌙 晚间' };
const DEFAULT_TASKS = [
  { id: 'a1', cat: 'morning', emoji: '💧', bg: '#E6F1FB', title: '喝一杯水', sub: '起床后第一件事', color: '#378ADD' },
  { id: 'a2', cat: 'morning', emoji: '🧘', bg: '#EEEDFE', title: '冥想 / 深呼吸', sub: '5分钟，清空大脑', color: '#7F77DD' },
  { id: 'a3', cat: 'morning', emoji: '📓', bg: '#FAEEDA', title: '写今日计划', sub: '3件最重要的事', color: '#BA7517' },
  { id: 'a4', cat: 'morning', emoji: '🪥', bg: '#FBEAF0', title: '洗漱 / 护肤', sub: '认真对待自己', color: '#D4537E' },
  { id: 'b1', cat: 'work', emoji: '🎨', bg: '#EEEDFE', title: '完成设计稿', sub: '专注工作 90 分钟', color: '#7F77DD' },
  { id: 'b2', cat: 'work', emoji: '📬', bg: '#E6F1FB', title: '处理消息 / 邮件', sub: '集中处理，不打断', color: '#378ADD' },
  { id: 'b3', cat: 'work', emoji: '📎', bg: '#EAF3DE', title: '整理设计文件', sub: '及时归档，不堆积', color: '#3B6D11' },
  { id: 'b4', cat: 'work', emoji: '🔍', bg: '#FAEEDA', title: '收集灵感参考', sub: '花 10 分钟逛灵感', color: '#BA7517' },
  { id: 'c1', cat: 'health', emoji: '🥗', bg: '#E1F5EE', title: '好好吃一顿饭', sub: '不刷手机，专心吃', color: '#1D9E75' },
  { id: 'c2', cat: 'health', emoji: '🚶', bg: '#EAF3DE', title: '散步 / 运动', sub: '至少 20 分钟', color: '#3B6D11' },
  { id: 'c3', cat: 'health', emoji: '💧', bg: '#E6F1FB', title: '喝够 8 杯水', sub: '今天水喝够了吗', color: '#378ADD' },
  { id: 'c4', cat: 'health', emoji: '👁️', bg: '#FBEAF0', title: '眼睛休息一下', sub: '看远处 20 秒', color: '#D4537E' },
  { id: 'd1', cat: 'evening', emoji: '📖', bg: '#EEEDFE', title: '阅读 30 分钟', sub: '纸书或 Kindle', color: '#534AB7' },
  { id: 'd2', cat: 'evening', emoji: '✏️', bg: '#FAEEDA', title: '复盘今天', sub: '做了什么，学了什么', color: '#BA7517' },
  { id: 'd3', cat: 'evening', emoji: '📵', bg: '#FAECE7', title: '放下手机', sub: '睡前 1 小时不刷', color: '#D85A30' },
  { id: 'd4', cat: 'evening', emoji: '🌙', bg: '#E1F5EE', title: '准时入睡', sub: '23:30 前上床', color: '#1D9E75' },
];

const EMOJIS = ['💧','🧘','📓','🪥','🎨','📬','📎','🔍','🥗','🚶','👁️','📖','✏️','📵','🌙','☕','🎧','🍵','✨','🌸','🐾','💪','📝','🎯','💤','🧹','🏋️','🎵','📸','🛁'];
const COLORS = [
  { c:'#7F77DD', b:'#EEEDFE' }, { c:'#378ADD', b:'#E6F1FB' },
  { c:'#1D9E75', b:'#E1F5EE' }, { c:'#3B6D11', b:'#EAF3DE' },
  { c:'#BA7517', b:'#FAEEDA' }, { c:'#D85A30', b:'#FAECE7' },
  { c:'#D4537E', b:'#FBEAF0' }, { c:'#534AB7', b:'#EEEDFE' },
];

const MOTIVES = [
  { emoji: '🌿', title: '今天也要好好的', sub: '一项一项来，不慌不忙' },
  { emoji: '🔥', title: '状态来了！', sub: '趁热打铁，继续冲！' },
  { emoji: '🎯', title: '已经完成一半了', sub: '剩下的，慢慢来' },
  { emoji: '🏆', title: '今日全部搞定！', sub: '给自己一个奖励吧' },
  { emoji: '☁️', title: '休息也是一种成就', sub: '不要对自己太苛刻' },
];

const TASKS_KEY = 'my_tasks_v2';
const TODAY = new Date();
const TODAY_KEY = 'checklist_' + new Date().toISOString().slice(0, 10);

let state = JSON.parse(localStorage.getItem(TODAY_KEY) || '{}');
let manageMode = false;
let editingTaskId = null;

function loadTasks() {
  const raw = localStorage.getItem(TASKS_KEY);
  if (!raw) { saveTasks(DEFAULT_TASKS); return [...DEFAULT_TASKS]; }
  return JSON.parse(raw);
}
function saveTasks(tasks) { localStorage.setItem(TASKS_KEY, JSON.stringify(tasks)); }
let TASKS = loadTasks();

function genId() {
  return 't' + Date.now() + Math.floor(Math.random()*999);
}

// ---- Calendar ----
let calYear = TODAY.getFullYear(), calMonth = TODAY.getMonth();

function calKey(y, m, d) {
  return 'checklist_' + y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
}
function isDayDone(y, m, d) {
  const s = JSON.parse(localStorage.getItem(calKey(y, m, d)) || '{}');
  return TASKS.every(t => s[t.id]);
}
function isDayPartial(y, m, d) {
  const s = JSON.parse(localStorage.getItem(calKey(y, m, d)) || '{}');
  return TASKS.some(t => s[t.id]);
}

function renderCalendar() {
  const grid = document.getElementById('cal-grid');
  document.getElementById('cal-month-label').textContent = calYear + '年 ' + (calMonth + 1) + '月';
  grid.innerHTML = '';
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

  for (let i = 0; i < firstDay; i++) {
    const blank = document.createElement('div'); blank.className = 'cal-day empty'; grid.appendChild(blank);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const isToday = d === TODAY.getDate() && calMonth === TODAY.getMonth() && calYear === TODAY.getFullYear();
    const partial = isDayPartial(calYear, calMonth, d);
    const el = document.createElement('div');
    el.className = 'cal-day' + (isToday ? ' today' : '') + (partial ? ' checked' : '');
    el.innerHTML = `<span>${d}</span><div class="cal-dot"></div>`;
    el.title = isDayDone(calYear, calMonth, d) ? '全部完成' : partial ? '部分完成' : '';
    el.onclick = () => calJumpTo(calYear, calMonth, d);
    grid.appendChild(el);
  }
}

function calJumpTo(y, m, d) {
  const isToday = d === TODAY.getDate() && m === TODAY.getMonth() && y === TODAY.getFullYear();
  if (!isToday) {
    const s = JSON.parse(localStorage.getItem(calKey(y,m,d))||'{}');
    alert(`${y}年${m+1}月${d}日\n完成 ${TASKS.filter(t=>s[t.id]).length} / ${TASKS.length} 项`);
  }
}
function calPrev() { calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCalendar(); }
function calNext() { calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCalendar(); }

function saveState() { localStorage.setItem(TODAY_KEY, JSON.stringify(state)); }

/* ---- Render ---- */
function renderGroup(containerId, tasks, showAddBtn) {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = '';
  tasks.forEach(task => {
    const done = !!state[task.id];
    const item = document.createElement('div');
    item.className = 'check-item' + (done ? ' done' : '') + (manageMode && !done ? ' show-del' : '');
    item.id = 'item-' + task.id + '-' + containerId;
    item.innerHTML = `
      <div class="item-icon" style="background:${task.bg}">${task.emoji}</div>
      <div class="item-content">
        <div class="item-title-row">
          <div class="item-title">${task.title}</div>
          <button class="item-edit-btn ${manageMode?'visible':''}" onclick="event.stopPropagation();openEditModal('${task.id}')">✏️</button>
        </div>
        <div class="item-sub">${task.sub}</div>
      </div>
      <button class="item-delete-btn" onclick="event.stopPropagation();quickDelete('${task.id}')">✕</button>
      <div class="checkbox" style="--border-check:${task.color}40;--check-color:${task.color}">
        <svg width="13" height="10" viewBox="0 0 13 10" fill="none">
          <path d="M1.5 5L5 8.5L11.5 1.5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>`;
    item.onclick = () => toggle(task.id);
    // long press to edit on mobile
    let timer;
    item.addEventListener('touchstart', e => {
      timer = setTimeout(() => { openEditModal(task.id); }, 500);
    }, { passive: true });
    item.addEventListener('touchend', () => clearTimeout(timer));
    item.addEventListener('touchmove', () => clearTimeout(timer));
    el.appendChild(item);
  });
  if (showAddBtn) {
    const btn = document.createElement('button');
    btn.className = 'add-btn';
    btn.innerHTML = '<span class="add-btn-icon">+</span> 添加新计划';
    btn.onclick = (e) => { e.stopPropagation(); openAddModal(getCatFromContainer(containerId)); };
    el.appendChild(btn);
  }
}

function getCatFromContainer(id) {
  if (id.includes('morning')) return 'morning';
  if (id.includes('work')) return 'work';
  if (id.includes('health')) return 'health';
  return 'evening';
}

function renderAll() {
  const cats = ['morning','work','health','evening'];
  cats.forEach(cat => {
    const tasks = TASKS.filter(t => t.cat === cat);
    renderGroup('group-' + cat + '-all', tasks, true);
    renderGroup('group-' + cat + '-tab', tasks, true);
    // update section label in "all" tab
    const labelEl = document.querySelector('#group-' + cat + '-all').previousElementSibling;
    if (labelEl) labelEl.querySelector('span').textContent = CAT_LABELS[cat];
  });
  updateProgress();
}

function toggle(id) {
  state[id] = !state[id];
  saveState();
  document.querySelectorAll('[id^="item-' + id + '-"]').forEach(el => {
    el.classList.toggle('done', !!state[id]);
    if (manageMode && !state[id]) el.classList.add('show-del'); else el.classList.remove('show-del');
  });
  updateProgress();
  if (state[id]) popEffect();
  renderCalendar();
}

function updateProgress() {
  const total = TASKS.length;
  const done = TASKS.filter(t => state[t.id]).length;
  const pct = total > 0 ? Math.round(done / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = pct + '%';

  let mi = 0;
  if (pct >= 100) mi = 3;
  else if (pct >= 50) mi = 2;
  else if (pct >= 25) mi = 1;
  const m = MOTIVES[mi];
  document.getElementById('motive-emoji').textContent = m.emoji;
  document.getElementById('motive-title').textContent = m.title;
  document.getElementById('motive-sub').textContent = m.sub;

  const banner = document.getElementById('all-done-banner');
  banner.style.display = (total > 0 && pct >= 100) ? 'flex' : 'none';
  if (total > 0 && pct >= 100) launchConfetti();
}

function switchTab(tab, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
}

function resetAll() {
  if (!confirm('确定要重置今日所有打卡吗？')) return;
  state = {}; saveState(); renderAll(); renderCalendar();
}

/* ---- Manage mode ---- */
function toggleManageMode() {
  manageMode = !manageMode;
  const btn = document.getElementById('manage-btn');
  btn.textContent = manageMode ? '✓ 完成管理' : '✏️ 管理计划';
  btn.classList.toggle('active', manageMode);
  document.querySelectorAll('.item-edit-btn').forEach(b => b.classList.toggle('visible', manageMode));
  document.querySelectorAll('.check-item:not(.done)').forEach(el => el.classList.toggle('show-del', manageMode));
}

/* ---- Quick delete from manage mode ---- */
function quickDelete(id) {
  if (!confirm('确定删除这个计划吗？')) return;
  TASKS = TASKS.filter(t => t.id !== id);
  saveTasks(TASKS);
  delete state[id];
  saveState();
  renderAll(); renderCalendar();
}

/* ==================== MODAL ==================== */

const fTitle = document.getElementById('f-title');
const fSub = document.getElementById('f-sub');
const fEmojiGrid = document.getElementById('f-emoji-grid');
const fColorGrid = document.getElementById('f-color-grid');

// Build emoji & color pickers once
(function buildPickers() {
  EMOJIS.forEach(e => {
    const opt = document.createElement('div'); opt.className='emoji-opt'; opt.textContent=e; opt.dataset.v=e;
    opt.onclick = () => selectEmoji(opt);
    fEmojiGrid.appendChild(opt);
  });
  COLORS.forEach(co => {
    const opt = document.createElement('div'); opt.className='color-opt';
    opt.style.background=co.b; opt.dataset.c=co.c; opt.dataset.b=co.b;
    opt.onclick = () => selectColor(opt);
    fColorGrid.appendChild(opt);
  });
})();

let pickedEmoji = '⭐', pickedColorIdx = 0, pickedCat = 'evening';

function openAddModal(cat) {
  editingTaskId = null;
  document.getElementById('modal-title').textContent = '添加新计划';
  document.getElementById('btn-delete-task').style.display = 'none';
  fTitle.value = ''; fSub.value = '';
  pickedEmoji = '⭐'; pickedColorIdx = 0; pickedCat = cat || 'evening';
  resetFormUI();
  showModal();
}

function openEditModal(taskId) {
  editingTaskId = taskId;
  document.getElementById('modal-title').textContent = '编辑计划';
  document.getElementById('btn-delete-task').style.display = '';
  const t = TASKS.find(x => x.id === taskId);
  if (!t) return;
  fTitle.value = t.title; fSub.value = t.sub || '';
  pickedEmoji = t.emoji; pickedCat = t.cat;
  // find color index
  pickedColorIdx = COLORS.findIndex(c => c.c === t.color);
  if (pickedColorIdx < 0) pickedColorIdx = 0;
  resetFormUI();
  showModal();
}

function resetFormUI() {
  // emoji
  document.querySelectorAll('.emoji-opt').forEach(e =>
    e.classList.toggle('selected', e.dataset.v === pickedEmoji)
  );
  // color
  document.querySelectorAll('.color-opt').forEach(c => {
    const idx = Array.from(fColorGrid.children).indexOf(c);
    c.classList.toggle('selected', idx === pickedColorIdx);
  });
  // cat
  document.querySelectorAll('.cat-option').forEach(o =>
    o.classList.toggle('selected', o.dataset.cat === pickedCat)
  );
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
  editingTaskId = null;
}

function closeModalOnBg(e) {
  if (e.target === document.getElementById('modal')) closeModal();
}

function showModal() {
  document.getElementById('modal').classList.add('show');
  setTimeout(() => fTitle.focus(), 300);
}

function selectCat(el) {
  document.querySelectorAll('.cat-option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  pickedCat = el.dataset.cat;
}

function selectEmoji(el) {
  document.querySelectorAll('.emoji-opt').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  pickedEmoji = el.dataset.v;
}

function selectColor(el) {
  document.querySelectorAll('.color-opt').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  pickedColorIdx = Array.from(fColorGrid.children).indexOf(el);
}

function saveTask() {
  const title = fTitle.value.trim();
  if (!title) { fTitle.focus(); return; }

  const co = COLORS[pickedColorIdx] || COLORS[0];
  const data = {
    id: editingTaskId || genId(),
    cat: pickedCat,
    emoji: pickedEmoji,
    bg: co.b,
    title: title,
    sub: fSub.value.trim(),
    color: co.c,
  };

  if (editingTaskId) {
    const idx = TASKS.findIndex(t => t.id === editingTaskId);
    if (idx > -1) TASKS[idx] = data;
  } else {
    TASKS.push(data);
  }

  saveTasks(TASKS);
  closeModal();
  renderAll(); renderCalendar();
}

function deleteCurrentTask() {
  if (!editingTaskId) return;
  if (!confirm('确定删除这个计划吗？')) return;
  TASKS = TASKS.filter(t => t.id !== editingTaskId);
  saveTasks(TASKS);
  delete state[editingTaskId];
  saveState();
  closeModal();
  renderAll(); renderCalendar();
}

/* ---- Confetti ---- */
function popEffect() {
  const canvas = document.getElementById('confetti'), ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const particles = Array.from({length:18},()=>({
    x: Math.random()*canvas.width, y: canvas.height*0.4+Math.random()*60,
    r: 4+Math.random()*5, dx:(Math.random()-.5)*5, dy:-(3+Math.random()*5),
    color:['#7F77DD','#1D9E75','#D4537E','#378ADD','#BA7517'][Math.floor(Math.random()*5)],
    alpha:1, life:60+Math.random()*30
  }));
  let frame=0;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{ p.x+=p.dx;p.y+=p.dy;p.dy+=0.2;p.alpha-=1/p.life;
      ctx.globalAlpha=Math.max(0,p.alpha);ctx.fillStyle=p.color;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});
    if(++frame<80) requestAnimationFrame(draw);else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  draw();
}
function launchConfetti(){
  const canvas=document.getElementById('confetti'),ctx=canvas.getContext('2d');
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  const particles=Array.from({length:60},()=>({
    x:Math.random()*canvas.width,y:-10,r:4+Math.random()*5,
    dx:(Math.random()-.5)*4,dy:2+Math.random()*4,
    color:['#7F77DD','#1D9E75','#D4537E','#378ADD','#BA7517','#F0997B'][Math.floor(Math.random()*6)],
    alpha:1,life:120}));
  let frame=0;
  function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);particles.forEach(p=>{
    p.x+=p.dx;p.y+=p.dy;if(frame>60)p.alpha-=1/60;
    ctx.globalAlpha=Math.max(0,p.alpha);ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();});
    if(++frame<130)requestAnimationFrame(draw);else ctx.clearRect(0,0,canvas.width,canvas.height);}
  draw();
}

/* ---- Init ---- */
function setGreeting(){
  const h=new Date().getHours();
  let g=h<6?'夜深了 🌙':h<10?'早上好 ☀️':h<13?'上午好 🌤️':h<18?'下午好 🍵':'晚上好 🌙';
  document.getElementById('greeting-text').textContent=g;
  const d=new Date(), days=['日','一','二','三','四','五','六'];
  document.getElementById('date-title').textContent=`${d.getMonth()+1}月${d.getDate()}日 周${days[d.getDay()]}`;
}

setGreeting();
renderAll();
renderCalendar();
</script>
